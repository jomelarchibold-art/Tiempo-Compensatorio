<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Solicitud de Tiempo Compensatorio</title>
<style>
:root {
  box-sizing: border-box;
  --bg: #eef0f3;
  --bar: #fff;
  --ink: #1c1f24;
  --mut: #5b6470;
  --line: #d5d9df;
  --acc: #1f4e8c;
  --accink: #fff;
  --ok: #2e7d4f;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c;
    --bar: #1f2328;
    --ink: #e8eaed;
    --mut: #9aa3ad;
    --line: #33393f;
    --acc: #6ea3e6;
    --accink: #10151b;
    --ok: #6fcf97;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c;
  --bar: #1f2328;
  --ink: #e8eaed;
  --mut: #9aa3ad;
  --line: #33393f;
  --acc: #6ea3e6;
  --accink: #10151b;
  --ok: #6fcf97;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 16px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bar);
  z-index: 10;
}
.bar h1 {
  font-size: 15px;
  margin: 0;
  flex: 1;
  min-width: 180px;
}
.prog { font-size: 13px; color: var(--mut); }
.prog b { color: var(--ok); }
.meter {
  width: 110px;
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--ok);
  transition: width .2s;
}
button {
  font: inherit;
  cursor: pointer;
  border-radius: 8px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  min-height: 44px;
}
button.pri {
  background: var(--acc);
  color: var(--accink);
  border-color: var(--acc);
  font-weight: 600;
}
#msg {
  font-size: 13px;
  padding: 0 16px;
  margin: 8px auto 0;
  max-width: 820px;
  color: var(--mut);
  min-height: 18px;
}
.wrap {
  padding: 12px 12px 40px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.paper {
  background: #fff;
  color: #000;
  max-width: 820px;
  margin: 0 auto;
  padding: 28px 36px 36px;
  font-family: "Times New Roman", Times, serif;
  font-size: 14px;
  box-shadow: 0 2px 14px rgba(0,0,0,.18);
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}
.top img {
  width: 250px;
  max-width: 100%;
  height: auto;
}
.fecha label { display: block; margin-bottom: 2px; }
.fecha .r {
  display: flex;
  align-items: center;
  gap: 6px;
}
h2 {
  text-align: center;
  font-style: italic;
  font-weight: 700;
  font-size: 17px;
  line-height: 1.25;
  margin: 16px 0 20px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
}
.row > label { white-space: nowrap; }
.paper input[type=text],
.paper textarea {
  border: 1px solid #555;
  background: #fff;
  color: #000;
  font: inherit;
  padding: 6px 10px;
  border-radius: 0;
  min-width: 0;
  font-size: 16px !important;
}
.paper textarea {
  width: 100%;
  display: block;
  resize: vertical;
  min-height: 80px;
}
.paper input[type=text] {
  flex: 1;
  height: 40px;
}
.paper input.d {
  flex: none;
  width: 56px;
  text-align: center;
}
.paper input.y {
  flex: none;
  width: 80px;
  text-align: center;
}
.paper input:focus,
.paper textarea:focus {
  outline: 2px solid #1f4e8c;
  outline-offset: 0;
}
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  min-height: 44px;
}
.chk input {
  width: 26px;
  height: 26px;
  accent-color: #1f4e8c;
  margin: 0;
  cursor: pointer;
}
.lbl { margin: 0 0 4px; }
.sig {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 18px;
}
.sig small {
  display: block;
  margin-top: 2px;
  font-size: 13px;
}
.sig input {
  width: 100%;
  height: 42px;
  margin-top: 4px;
  border: 1px solid #555;
  font: inherit;
  padding: 6px 10px;
  font-size: 16px !important;
}

@media (max-width: 620px) {
  .paper {
    padding: 18px 14px;
  }
  .row {
    flex-wrap: wrap;
  }
  .row > label {
    min-width: 100%;
    margin-bottom: 4px;
  }
  .sig {
    grid-template-columns: 1fr;
  }
  .bar {
    padding: 12px 14px;
  }
  button {
    min-height: 46px;
    padding: 12px 18px;
  }
  .chk input {
    width: 28px;
    height: 28px;
  }
  .paper input[type=text],
  .paper textarea,
  .sig input {
    font-size: 16px !important;
  }
}
</style>
</head>

const $ = id => document.getElementById(id);
const TXT = ["fd","fm","fy","para","de","dia","grupo","motivo","acT","acV","trab","ult","rrhh","hor","vb1","vb2"];
const CNT = TXT.concat(["c1"]);
$("t").textContent = CNT.length;

function upd() {
  let n = TXT.filter(i => $(i).value.trim()).length + (["c1","c2","c3"].some(i => $(i).checked) ? 1 : 0);
  $("n").textContent = n;
  $("m").style.width = (100 * n / CNT.length) + "%";
}

$("f").addEventListener("input", upd);
$("f").addEventListener("change", upd);

["fd","fm","fy"].forEach(i => {
  $(i).addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g, ""));
});

$("hoy").onclick = () => {
  const d = new Date();
  $("fd").value = String(d.getDate()).padStart(2, "0");
  $("fm").value = String(d.getMonth() + 1).padStart(2, "0");
  $("fy").value = d.getFullYear();
  upd();
};

$("clr").onclick = () => {
  if (confirm("¿Borrar todos los campos?")) {
    $("f").reset();
    upd();
    say("");
  }
};

function say(s) {
  $("msg").textContent = s;
}

function getJsPDF() {
  // Compatible con diferentes formas de carga de jsPDF
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  if (window.jsPDF) return window.jsPDF;
  if (typeof jspdf !== "undefined" && jspdf.jsPDF) return jspdf.jsPDF;
  return null;
}

function build() {
  const jsPDF = getJsPDF();
  if (!jsPDF) {
    throw new Error("La librería PDF no se cargó. Verifica tu conexión a internet e intenta de nuevo.");
  }
  const p = new jsPDF({ unit: "pt", format: "letter" });
  const L = 47, R = 565;
  p.setLineWidth(.75);
  p.setDrawColor(85);
  p.setTextColor(0);

  const lab = (t, x, y) => {
    p.setFont("times", "normal");
    p.setFontSize(10);
    p.text(t, x, y);
  };
  const box = (x, y, w, h, t) => {
    p.rect(x, y, w, h);
    if (t) {
      p.setFont("times", "normal");
      p.setFontSize(10);
      p.text(String(t), x + 4, y + h / 2 + 3.5, { maxWidth: w - 8 });
    }
  };
  const area = (x, y, w, h, t) => {
    p.rect(x, y, w, h);
    if (t) {
      p.setFont("times", "normal");
      p.setFontSize(10);
      const ls = p.splitTextToSize(t, w - 10);
      const mx = Math.floor((h - 6) / 12);
      p.text(ls.slice(0, mx), x + 5, y + 13);
    }
  };
  const ck = (x, y, on) => {
    p.rect(x, y, 18, 18);
    if (on) {
      p.setLineWidth(1.5);
      p.line(x + 4, y + 4, x + 14, y + 14);
      p.line(x + 14, y + 4, x + 4, y + 14);
      p.setLineWidth(.75);
    }
  };

  p.addImage(LOGO, "PNG", L, 34, 236, 50.3);
  lab("Fecha:", 380, 46);
  box(380, 52, 36, 18, $("fd").value);
  lab("/", 420, 64);
  box(428, 52, 36, 18, $("fm").value);
  lab("/", 468, 64);
  box(476, 52, 50, 18, $("fy").value);

  p.setFont("times", "bolditalic");
  p.setFontSize(13);
  p.text("SOLICITUD DE TIEMPO COMPENSATORIOS", 306, 114, { align: "center" });
  p.text("VACACIONES- PERMISO PERSONAL", 306, 129, { align: "center" });

  lab("Para:", L, 156);
  box(100, 142, R - 100, 22, $("para").value);
  lab("De:", L, 186);
  box(100, 172, R - 100, 22, $("de").value);

  lab("Solicito:", L, 221);
  lab("TIEMPO", 135, 221);
  ck(187, 208, $("c1").checked);
  lab("VACACIONES", 240, 221);
  ck(330, 208, $("c2").checked);
  lab("PERMISO", 380, 221);
  ck(430, 208, $("c3").checked);

  lab("Día y fecha solicitada:", L, 258);
  box(175, 244, R - 175, 22, $("dia").value);
  lab("Grupo Asignado:", L, 288);
  box(152, 274, R - 152, 22, $("grupo").value);

  lab("Motivo:", L, 318);
  area(L, 324, R - L, 80, $("motivo").value);

  lab("Tiempo acumulado:", L, 436);
  lab("TIEMPO", 165, 436);
  box(238, 422, 62, 22, $("acT").value);
  lab("VACACIONES", 305, 436);
  box(390, 422, R - 390, 22, $("acV").value);

  lab("Tiempo correspondiente al trabajado:", L, 470);
  box(262, 456, R - 262, 22, $("trab").value);
  lab("Ultima vacaciones tomadas:", L, 502);
  box(205, 488, R - 205, 22, $("ult").value);
  lab("Enlace de RRHH que tramita:", L, 532);
  box(205, 518, R - 205, 22, $("rrhh").value);

  lab("Horario:", L, 566);
  area(L, 572, R - L, 46, $("hor").value);

  lab("V.B.", L, 642);
  lab("V.B.", 320, 642);
  box(L, 652, 248, 26, $("vb1").value);
  box(320, 652, R - 320, 26, $("vb2").value);
  lab("Jefe encargado o supervisor", L, 692);
  lab("Director/Subdirector/Operaciones", 320, 692);

  return p;
}

$("dl").onclick = async () => {
  try {
    say("Generando PDF...");
    const p = build();
    const d = [$("fy").value, $("fm").value, $("fd").value].every(Boolean)
      ? `${$("fy").value}-${$("fm").value}-${$("fd").value}`
      : new Date().toISOString().slice(0, 10);
    const name = `Solicitud_Tiempo_Compensatorio_${d}.pdf`;

    // Método más compatible con móviles (iOS Safari + Android)
    const blob = p.output("blob");
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    say("Descarga iniciada: " + name);
  } catch (e) {
    console.error(e);
    say("No se pudo generar el PDF: " + (e && e.message ? e.message : "Error desconocido"));
  }
};

upd();

// Verificar que la librería se cargó
window.addEventListener("load", () => {
  if (!getJsPDF()) {
    say("Advertencia: No se pudo cargar la librería PDF. Necesitas conexión a internet para descargar el PDF.");
  }
});
</script>
